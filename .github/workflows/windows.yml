name: Windows MSVC static executable

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-msvc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-verify:
    name: Build and verify ASSDraw3.exe
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out ASSDraw
        uses: actions/checkout@v4

      - name: Identify the MSVC toolchain
        id: msvc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual Studio C++ tools were not found.' }
          $compiler = Get-ChildItem "$install\VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $compiler) { throw 'The x64 MSVC compiler was not found.' }
          $version = $compiler.VersionInfo.FileVersion
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          & cmake --version
          Write-Host "Visual Studio: $install"
          Write-Host "MSVC compiler: $($compiler.FullName) ($version)"

      - name: Restore pinned dependency build cache
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            build/lib
          key: windows-2022-x64-msvc-${{ steps.msvc.outputs.version }}-wx-3.2.11-agg-c4f36b4-mt-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure x64 Release build
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=ON

      - name: Build ASSDraw and tests
        shell: pwsh
        run: cmake --build build --config Release --parallel 2 --verbose

      - name: Run non-interactive tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify static runtime dependencies and embedded resources
        shell: pwsh
        run: .\ci\verify-windows-binary.ps1 -Executable .\build\Release\ASSDraw3.exe

      - name: Smoke-test the standalone executable
        shell: pwsh
        run: .\ci\smoke-test-windows.ps1 -Executable .\build\Release\ASSDraw3.exe

      - name: Upload the single-file application
        uses: actions/upload-artifact@v4
        with:
          name: ASSDraw3-windows-x64
          path: build/Release/ASSDraw3.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
